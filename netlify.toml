[build]
  command = "yarn build"
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "20"

# Force HTTPS
[[redirects]]
  from = "http://app-suite.io/*"
  to = "https://app-suite.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.app-suite.io/*"
  to = "https://app-suite.io/:splat"
  status = 301
  force = true

# Redirect www to non-www
[[redirects]]
  from = "https://www.app-suite.io/*"
  to = "https://app-suite.io/:splat"
  status = 301
  force = true
  
# Also redirect www subdomain at the root
[[redirects]]
  from = "https://www.app-suite.io"
  to = "https://app-suite.io"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@sendgrid/mail", "nodemailer"]
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"